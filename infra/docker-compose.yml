services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadpilot
      POSTGRES_PASSWORD: leadpilot
      POSTGRES_DB: leadpilot
    ports:
      - "5432:5432"
    volumes:
      - leadpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadpilot -d leadpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - leadpilot_redisdata:/data
volumes:
  leadpilot_pgdata:
  leadpilot_redisdata:
