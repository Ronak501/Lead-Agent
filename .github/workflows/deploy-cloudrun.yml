name: Build and Deploy Full Stack (Frontend + Backend) to Cloud Run

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1
  REPOSITORY_NAME: cloud-run-source-deploy
  BACKEND_SERVICE: leadpilot-api
  FRONTEND_SERVICE: leadpilot-web

jobs:
  # ==========================================
  # 1. DEPLOY BACKEND (FastAPI API)
  # ==========================================
  deploy-backend:
    name: Deploy Backend (LeadPilot API)
    runs-on: ubuntu-latest
    outputs:
      backend_url: ${{ steps.deploy-api.outputs.url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Cloud Authentication
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker with Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry Repository Exists
        run: |
          gcloud artifacts repositories describe ${{ env.REPOSITORY_NAME }} \
            --location=${{ env.REGION }} || \
          gcloud artifacts repositories create ${{ env.REPOSITORY_NAME }} \
            --repository-format=docker \
            --location=${{ env.REGION }} \
            --description="Docker repository for LeadPilot services"

      - name: Build and Push Backend Docker Image
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }}"
          LATEST_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.BACKEND_SERVICE }}:latest"
          
          docker build -t "$IMAGE_URI" -t "$LATEST_URI" ./apps/api
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

      - name: Deploy Backend to Cloud Run
        id: deploy-api
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.BACKEND_SERVICE }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: '--allow-unauthenticated --service-account=github-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL || 'postgresql://neondb_owner:npg_gW4XmLkyi7dE@ep-curly-term-b5ci0so6-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require' }}
            ALLOWED_OAUTH_DOMAIN=ornitech.in
            ADMIN_NOTIFICATION_EMAIL=founder@ornitech.in
            SENDER_EMAIL=founder@ornitech.in
            SENDER_NAME=Ornitech Solutions
            APP_ENV=production

  # ==========================================
  # 2. DEPLOY FRONTEND (Next.js Web UI)
  # ==========================================
  deploy-frontend:
    name: Deploy Frontend (Next.js Dashboard)
    needs: deploy-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Cloud Authentication
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker with Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Frontend Docker Image
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.FRONTEND_SERVICE }}:${{ github.sha }}"
          LATEST_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.FRONTEND_SERVICE }}:latest"
          
          # Pass the newly deployed backend Cloud Run URL directly to Next.js
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ needs.deploy-backend.outputs.backend_url }}" \
            -t "$IMAGE_URI" \
            -t "$LATEST_URI" \
            ./apps/web

          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

      - name: Deploy Frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.FRONTEND_SERVICE }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.FRONTEND_SERVICE }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: '--allow-unauthenticated --service-account=github-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'
          env_vars: |
            NEXT_PUBLIC_API_BASE_URL=${{ needs.deploy-backend.outputs.backend_url }}
